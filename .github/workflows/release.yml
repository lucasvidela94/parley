name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/parley.exe .
            (cd dist && zip -q "parley_${GOOS}_${GOARCH}.zip" parley.exe && rm parley.exe)
          else
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/parley .
            tar -C dist -czf "dist/parley_${GOOS}_${GOARCH}.tar.gz" parley
            rm dist/parley
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: parley-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.tar.gz *.zip > checksums.txt
      # Keyless signature of checksums.txt, tied to this workflow's identity
      # through GitHub OIDC. The bundle holds the signature, the certificate
      # and the transparency log entry, so verifying needs only cosign.
      - uses: sigstore/cosign-installer@v3
      # Best effort until a tag has gone through it once: a signing failure
      # must not block the release, which still ships sha256 checksums.
      - name: sign checksums
        continue-on-error: true
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      # The release notes are this version's section of CHANGELOG.md, so a
      # release cannot go out without them.
      - name: release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entries under [$version]" >&2
            exit 1
          fi
          cat notes.md .github/release-install.md > body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: body.md
